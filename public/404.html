<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OnSite Cab Detailing</title>
    <script>
      // GitHub Pages returns 404 for client routes. Bounce to / with the
      // path in the query string so a cached homepage can't skip restore.
      var path = location.pathname + location.search + location.hash;
      location.replace("/?spa=" + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
